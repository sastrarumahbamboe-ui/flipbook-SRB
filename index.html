<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Jurnal Sastra Rumah Bamboe</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f1f1f1;
      color: #222;
    }

    header {
      background: #111;
      color: white;
      padding: 22px 15px;
      text-align: center;
    }

    header h1 {
      margin: 0;
      font-family: Georgia, serif;
      font-size: 28px;
    }

    header p {
      margin: 7px 0 0;
      color: #ccc;
    }

    nav {
      background: #b40000;
      display: flex;
      justify-content: center;
      gap: 8px;
      padding: 10px;
      flex-wrap: wrap;
    }

    nav a {
      color: white;
      text-decoration: none;
      padding: 9px 14px;
      font-weight: bold;
      border-radius: 4px;
    }

    nav a:hover {
      background: rgba(255,255,255,0.18);
    }

    .container {
      max-width: 1100px;
      margin: auto;
      padding: 25px 15px;
    }

    .top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    .top h2 {
      margin: 0;
      font-family: Georgia, serif;
    }

    .upload-btn {
      background: #b40000;
      color: white;
      text-decoration: none;
      padding: 12px 18px;
      border-radius: 5px;
      font-weight: bold;
    }

    .upload-btn:hover {
      background: #880000;
    }

    #loading {
      text-align: center;
      padding: 30px;
    }

    #magazines {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 20px;
    }

    .card {
      background: white;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 2px 8px rgba(0,0,0,0.12);
    }

    .cover {
      width: 100%;
      height: 300px;
      object-fit: cover;
      background: #ddd;
    }

    .no-cover {
      height: 300px;
      background: #222;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 20px;
      font-family: Georgia, serif;
      font-size: 22px;
    }

    .card-content {
      padding: 15px;
    }

    .card h3 {
      margin: 0 0 8px;
      font-family: Georgia, serif;
    }

    .card p {
      color: #666;
      font-size: 14px;
      line-height: 1.5;
    }

    .read-btn {
      display: block;
      text-align: center;
      background: #111;
      color: white;
      text-decoration: none;
      padding: 10px;
      border-radius: 4px;
      margin-top: 12px;
    }

    .read-btn:hover {
      background: #b40000;
    }

    footer {
      text-align: center;
      padding: 30px 15px;
      margin-top: 30px;
      background: #111;
      color: #aaa;
    }

    @media (max-width: 600px) {
      header h1 {
        font-size: 22px;
      }

      .cover,
      .no-cover {
        height: 260px;
      }
    }
  </style>
</head>

<body>

<header>
  <h1>JURNAL SASTRA RUMAH BAMBOE</h1>
  <p>Majalah Sastra & Kebudayaan</p>
</header>

<nav>
  <a href="index.html">BERANDA</a>
  <a href="upload.html">UPLOAD MAJALAH</a>
  <a href="admin.html">ADMIN</a>
</nav>

<div class="container">

  <div class="top">
    <h2>Majalah SRB</h2>

    <a class="upload-btn" href="upload.html">
      + Upload Majalah
    </a>
  </div>

  <div id="loading">
    Memuat majalah...
  </div>

  <div id="magazines"></div>

</div>

<footer>
  © Jurnal Sastra Rumah Bamboe
</footer>

<script>

  const supabaseClient =
    window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_ANON_KEY
    );

  async function loadMagazines() {

    const loading = document.getElementById("loading");
    const container = document.getElementById("magazines");

    const { data, error } = await supabaseClient
      .from("magazines")
      .select("*")
      .order("created_at", { ascending: false });

    if (error) {

      loading.innerHTML =
        "Gagal memuat majalah: " + error.message;

      return;
    }

    loading.style.display = "none";

    if (!data || data.length === 0) {

      container.innerHTML = `
        <div style="grid-column:1/-1;text-align:center;padding:40px;background:white;">
          <h3>Belum ada majalah</h3>
          <p>Silakan menjadi yang pertama mengunggah majalah.</p>
        </div>
      `;

      return;
    }

    data.forEach(magazine => {

      let cover = "";

      if (magazine.cover_url) {

        cover = `
          <img
            class="cover"
            src="${magazine.cover_url}"
            alt="${escapeHtml(magazine.title)}"
          >
        `;

      } else {

        cover = `
          <div class="no-cover">
            ${escapeHtml(magazine.title)}
          </div>
        `;
      }

      const card = document.createElement("div");

      card.className = "card";

      card.innerHTML = `
        ${cover}

        <div class="card-content">

          <h3>
            ${escapeHtml(magazine.title)}
          </h3>

          <p>
            ${escapeHtml(magazine.description || "Majalah Sastra Rumah Bamboe")}
          </p>

          <a
            class="read-btn"
            href="reader.html?id=${magazine.id}"
          >
            BACA MAJALAH
          </a>

        </div>
      `;

      container.appendChild(card);

    });

  }

  function escapeHtml(text) {

    return String(text)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");

  }

  loadMagazines();

</script>

</body>
  </html>
